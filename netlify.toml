[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Security headers (Netlify only; GitHub Pages can't set headers).
# Old checkout / trial pages now live on the dashboard. Query strings are dropped on purpose.
[[redirects]]
  from = "/subscribe"
  to = "https://dashboard.disconotify.com/billing"
  status = 301
  force = true

[[redirects]]
  from = "/manage"
  to = "https://dashboard.disconotify.com/billing"
  status = 301
  force = true

[[redirects]]
  from = "/thanks"
  to = "https://dashboard.disconotify.com/billing"
  status = 301
  force = true

[[redirects]]
  from = "/pay"
  to = "https://dashboard.disconotify.com/billing"
  status = 301
  force = true

[[redirects]]
  from = "/activate"
  to = "https://dashboard.disconotify.com"
  status = 301
  force = true

[[redirects]]
  from = "/auth/callback"
  to = "https://dashboard.disconotify.com"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.discordapp.com; font-src 'self'; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
